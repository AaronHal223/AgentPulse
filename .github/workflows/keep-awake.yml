# Render's free plan puts the app to sleep after 15 quiet minutes, and waking takes about a minute.
# This pings it every 10 minutes from 6 AM to midnight Eastern so it opens instantly during the day.
# It hits /api/live, which doesn't touch the database, so the database still gets to rest.
# Free for public repositories. Optional: set a repository variable APP_URL if the address changes.
name: Keep awake

on:
  schedule:
    - cron: "*/10 10-23,0-3 * * *" # UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the app
        env:
          APP_URL: ${{ vars.APP_URL || 'https://agentpulse-skse.onrender.com' }}
        run: |
          for i in 1 2 3; do
            curl -sS --fail --max-time 90 "$APP_URL/api/live" && exit 0
            sleep 15
          done
          echo "::warning::The app did not answer at $APP_URL"
