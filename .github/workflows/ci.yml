# Checks every push and pull request: type-check, production build, and an end-to-end smoke test.
# Render waits for this to pass before deploying (autoDeployTrigger: checksPass in render.yaml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI uses a throwaway local database and test-only secret; real deployments must set both properly.
      ALLOW_LOCAL_DB: "1"
      AUTH_SECRET: ci-only-secret-not-used-anywhere-real-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Build (with local test database)
        run: npm run build
      - name: Start app
        run: |
          npm start -- -p 3000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/live && break; sleep 2; done
      - name: Smoke test
        run: BASE_URL=http://localhost:3000 node scripts/smoke-test.mjs
      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true
