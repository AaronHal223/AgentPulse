# Free Render setup: the website only. Everything else is free elsewhere:
#   • Database   → Neon (free, permanent, encrypted): paste its connection string into DATABASE_URL
#   • Daily brief → GitHub Actions (.github/workflows/daily-brief.yml), every morning
#   • Keep-awake  → GitHub Actions (.github/workflows/keep-awake.yml), so pages open fast
# Render → New → Blueprint → pick this repo (or set the same variables on an existing web service).
services:
  - type: web
    name: agentpulse
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/live # doesn't touch the database, so a database blip can't restart the app
    autoDeployTrigger: checksPass # deploy only after GitHub CI passes
    envVars:
      - key: DATABASE_URL
        sync: false # Neon connection string (postgresql://…?sslmode=require)
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: SIGNUP_CODE
        sync: false # invite code people need to create an account
      - key: AI_PROVIDER
        value: gemini # change to claude when you go live
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false # only needed when AI_PROVIDER=claude
      - key: ORS_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_URL
        sync: false # e.g. https://agentpulse-skse.onrender.com
      - key: APP_TIMEZONE
        value: America/New_York
      - key: NODE_OPTIONS
        value: --max-old-space-size=400 # stay under the free plan's 512 MB
